<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc"><title id="title">DIA conceptual architecture and reconstruction scope</title><desc id="desc">Conceptual redrawing of the architecture in the source papers. Green components are reconstructed. Gray dashed components show metadata discovery outside the reconstruction. External actors and personal data stores are blue.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#60758b"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20344a}.title{font-size:27px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:15px}</style><rect width="1200" height="1000" fill="white"/><text x="40" y="48" class="title">DIA conceptual architecture and reconstruction scope</text><text x="40" y="85" class="small">Conceptual redrawing based on the source papers; green marks the reconstructed path.</text><rect x="50" y="130" width="320" height="105" rx="12" fill="#eef3f9" stroke="#91a9c2" stroke-width="1.5"/><text x="68" y="162" class="head">End users</text><text x="68" y="195" class="body">Register data; manage authorization</text><rect x="570" y="130" width="300" height="105" rx="12" fill="#eef3f9" stroke="#91a9c2" stroke-width="1.5"/><text x="588" y="162" class="head">Applications</text><text x="588" y="195" class="body">Discover, resolve, and request data</text><rect x="30" y="310" width="840" height="535" rx="18" fill="#fafcfd" stroke="#c7d3df"/><text x="50" y="345" class="head">Data Interoperating System (DIS)</text><rect x="60" y="400" width="350" height="255" rx="12" fill="#eaf4ee" stroke="#78a28b" stroke-width="1.5"/><text x="78" y="432" class="head">Blockchain platform</text><text x="78" y="465" class="body">Identity Management</text><text x="78" y="492" class="body">Data Management</text><text x="78" y="519" class="body">Authorization Management</text><rect x="80" y="565" width="310" height="65" rx="12" fill="#f6f6f6" stroke="#b6bcc3" stroke-width="1.5" stroke-dasharray="7 5"/><text x="98" y="597" class="head">Metadata Management</text><rect x="495" y="400" width="345" height="190" rx="12" fill="#eaf4ee" stroke="#78a28b" stroke-width="1.5"/><text x="513" y="432" class="head">Identifier System</text><text x="513" y="465" class="body">Data Resolution</text><text x="513" y="492" class="body">Identity Authentication</text><text x="513" y="519" class="body">Authorization Verification</text><rect x="495" y="700" width="345" height="105" rx="12" fill="#f6f6f6" stroke="#b6bcc3" stroke-width="1.5" stroke-dasharray="7 5"/><text x="513" y="732" class="head">Data Discovery Service</text><text x="513" y="765" class="body">Reverse Lookup</text><rect x="925" y="400" width="245" height="205" rx="12" fill="#eef3f9" stroke="#91a9c2" stroke-width="1.5"/><text x="943" y="432" class="head">Personal Data Store</text><text x="943" y="465" class="body">Access Control</text><text x="943" y="492" class="body">Original data storage</text><path d="M210 235 V400" fill="none" stroke="#60758b" stroke-width="2" marker-end="url(#arrow)"/><text x="70" y="283" class="small">Registration / authorization</text><path d="M600 235 V280 H430 V480 H410" fill="none" stroke="#60758b" stroke-width="2" marker-end="url(#arrow)"/><text x="435" y="275" class="small">Management requests</text><path d="M720 235 V400" fill="none" stroke="#60758b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="725" y="302" class="small">Resolution queries</text><path d="M410 480 H495" fill="none" stroke="#60758b" stroke-width="2" marker-end="url(#arrow)"/><text x="415" y="382" class="small">Identifier updates</text><path d="M410 610 H455 V750 H495" fill="none" stroke="#60758b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="310" y="689" class="small">Metadata updates</text><path d="M660 235 V265 H900 V750 H840" fill="none" stroke="#60758b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="745" y="665" class="small">Discovery queries</text><path d="M870 170 H1045 V400" fill="none" stroke="#60758b" stroke-width="2" marker-end="url(#arrow)"/><text x="925" y="250" class="small">Data access / return</text><path d="M925 510 H840" fill="none" stroke="#60758b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="861" y="496" class="small">Lookup</text><text x="925" y="649" class="small">Identity and authorization</text><text x="925" y="676" class="small">checks use Identifier System</text><text x="50" y="892" class="small">Green: reconstructed components    Blue: external actors / services    Gray dashed: outside current scope</text><text x="50" y="930" class="small">Redrawn with reference to the original DIA architecture figure in the two source papers.</text><text x="50" y="957" class="small">References: Data Interoperating Architecture (DIA), Figure 1; Dominate data by yourself, Figure 4.</text></svg>