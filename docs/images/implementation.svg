<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc"><title id="title">DIS-reconstruct implementation</title><desc id="desc">Signed requests enter the API and Fabric contracts. Committed events are synchronized to Redis. CoreDNS exposes identifier records. Fabric nodes may be distributed while API, sync, Redis and CoreDNS run on the controller.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#60758b"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20344a}.title{font-size:27px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:15px}</style><rect width="1200" height="1000" fill="white"/><text x="40" y="48" class="title">DIS-reconstruct implementation</text><rect x="50" y="105" width="350" height="100" rx="12" fill="#eef3f9" stroke="#91a9c2" stroke-width="1.5"/><text x="68" y="137" class="head">Users and applications</text><text x="68" y="170" class="body">Sign registration / management requests</text><rect x="490" y="105" width="290" height="100" rx="12" fill="#eef3f9" stroke="#91a9c2" stroke-width="1.5"/><text x="508" y="137" class="head">DNS clients</text><text x="508" y="170" class="body">Resolve identifier records</text><rect x="50" y="285" width="350" height="100" rx="12" fill="#eaf4ee" stroke="#78a28b" stroke-width="1.5"/><text x="68" y="317" class="head">DIS API</text><text x="68" y="350" class="body">Forward signed requests to Gateway</text><rect x="50" y="465" width="405" height="230" rx="12" fill="#eaf4ee" stroke="#78a28b" stroke-width="1.5"/><text x="68" y="497" class="head">Hyperledger Fabric</text><text x="68" y="530" class="body">Identity, data, authorization contracts</text><text x="68" y="557" class="body">Verify signatures and ownership</text><text x="68" y="584" class="body">Endorse, order, validate, commit</text><text x="68" y="611" class="body">Peer + orderer + chaincode processes</text><rect x="530" y="465" width="270" height="145" rx="12" fill="#eaf4ee" stroke="#78a28b" stroke-width="1.5"/><text x="548" y="497" class="head">Synchronization service</text><text x="548" y="530" class="body">Replay committed blocks</text><text x="548" y="557" class="body">Follow committed events</text><text x="548" y="584" class="body">Persist recovery checkpoint</text><rect x="880" y="465" width="270" height="120" rx="12" fill="#eaf4ee" stroke="#78a28b" stroke-width="1.5"/><text x="898" y="497" class="head">Redis</text><text x="898" y="530" class="body">DNS records</text><text x="898" y="557" class="body">Published state / checkpoint</text><rect x="880" y="690" width="270" height="120" rx="12" fill="#eaf4ee" stroke="#78a28b" stroke-width="1.5"/><text x="898" y="722" class="head">CoreDNS + disredis</text><text x="898" y="755" class="body">Public keys and data attributes</text><text x="898" y="782" class="body">Authorization records</text><rect x="50" y="800" width="405" height="120" rx="12" fill="#eef3f9" stroke="#91a9c2" stroke-width="1.5"/><text x="68" y="832" class="head">External data service</text><text x="68" y="865" class="body">Retain payloads; authenticate requesters</text><text x="68" y="892" class="body">Check access and serve data</text><path d="M225 205 V285" fill="none" stroke="#60758b" stroke-width="2" marker-end="url(#arrow)"/><path d="M225 385 V465" fill="none" stroke="#60758b" stroke-width="2" marker-end="url(#arrow)"/><path d="M455 535 H530" fill="none" stroke="#60758b" stroke-width="2" marker-end="url(#arrow)"/><text x="535" y="440" class="small">Committed changes</text><path d="M800 535 H880" fill="none" stroke="#60758b" stroke-width="2" marker-end="url(#arrow)"/><path d="M1015 585 V690" fill="none" stroke="#60758b" stroke-width="2" marker-end="url(#arrow)"/><text x="1028" y="644" class="small">Serve records</text><path d="M635 205 V250 H1175 V655 H1070 V690" fill="none" stroke="#60758b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="805" y="235" class="small">DNS queries / responses</text><path d="M400 155 H475 V755 H250 V800" fill="none" stroke="#60758b" stroke-width="2" marker-end="url(#arrow)"/><text x="65" y="757" class="small">Data access / return</text><path d="M455 855 H835 V760 H880" fill="none" stroke="#60758b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="492" y="831" class="small">Identity / authorization lookups</text><text x="530" y="337" class="head">Deployment</text><text x="530" y="371" class="body">Fabric processes: one or multiple machines.</text><text x="530" y="398" class="body">API, sync, Redis, CoreDNS: controller.</text><text x="50" y="962" class="small">Fabric commit and DNS publication are separate completion points. Metadata discovery is not implemented.</text></svg>